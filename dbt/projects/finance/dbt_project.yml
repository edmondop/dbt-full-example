name: finance
version: "0.1.0"
config-version: 2
profile: marketplace
require-dbt-version: [">=1.12.0", "<1.13.0"]

model-paths: ["models"]
macro-paths: ["macros"]

dispatch:
  - macro_namespace: marketplace_macros
    search_order: ["finance", "marketplace_macros"]
  - macro_namespace: dbt
    search_order: ["dbt_project_evaluator", "dbt"]

vars:
  exclude_packages: [platform]
  reporting_currency: USD
  currency_minor_units: {JPY: 0, default: 2}
  unit_testing: false
  dev_schema_prefix: "{{ env_var('USER', 'dev') }}"

models:
  dbt_project_evaluator:
    +schema: finance_governance
    marts:
      core:
        # Cut the evaluator's recursive DAG query before Trino's stage limit.
        int_all_dag_relationships:
          +materialized: table
  finance:
    +group: finance
    staging:
      +schema: finance_staging
      +materialized: view
    intermediate:
      +schema: finance_intermediate
    marts:
      +schema: finance
      +materialized: table

data_tests:
  dbt_project_evaluator:
    marts:
      governance:
        +severity: error
