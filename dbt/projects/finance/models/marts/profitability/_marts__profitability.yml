models:
  - name: fct__contribution_by_day__usd_total
    description: One row per report_date and merchant. USD revenue, refunds, fees and contribution.
    columns:
      - name: report_date
        description: '{{ doc("report_date") }}'
      - name: merchant_id
        description: '{{ doc("merchant_id") }}'
      - name: revenue_usd
        description: '{{ doc("revenue_usd") }}'
      - name: refunded_usd
        description: '{{ doc("refunded_usd") }}'
      - name: fee_usd
        description: '{{ doc("fee_usd") }}'
      - name: contribution_usd
        description: '{{ doc("contribution_usd") }}'
  - name: fct__contribution_by_merchant__usd_total
    description: One row per merchant. Sums daily contribution_usd.
    columns:
      - name: merchant_id
        description: '{{ doc("merchant_id") }}'
      - name: contribution_usd
        description: '{{ doc("contribution_usd") }}'
  - name: fct__negative_margin_days
    description: One row per report_date and merchant with negative contribution_usd.
    columns:
      - name: report_date
        description: '{{ doc("report_date") }}'
      - name: merchant_id
        description: '{{ doc("merchant_id") }}'
      - name: revenue_usd
        description: '{{ doc("revenue_usd") }}'
      - name: refunded_usd
        description: '{{ doc("refunded_usd") }}'
      - name: fee_usd
        description: '{{ doc("fee_usd") }}'
      - name: contribution_usd
        description: '{{ doc("contribution_usd") }}'
  - name: fct__fee_burden_by_merchant__usd_total
    description: One row per merchant. Sums derived fees in USD.
    columns:
      - name: merchant_id
        description: '{{ doc("merchant_id") }}'
      - name: fee_usd
        description: '{{ doc("fee_usd") }}'
  - name: fct__refund_burden_by_merchant__usd_total
    description: One row per merchant. Sums refunds in USD.
    columns:
      - name: merchant_id
        description: '{{ doc("merchant_id") }}'
      - name: refunded_usd
        description: '{{ doc("refunded_usd") }}'
