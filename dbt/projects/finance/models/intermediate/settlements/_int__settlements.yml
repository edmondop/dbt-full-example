models:
  - name: int__settlements__payouts_with_attempts
    description: Grain payout_id. Payout with captured attempt and currency.
  - name: int__settlements__dated_payouts
    description: Grain payout_id. Payout with its UTC payout date.
  - name: int__settlements__payouts_by_day
    description: Grain (payout_date, merchant_id). Provider payout count and net minor units.
  - name: int__settlements__fees_by_payment
    description: Provider fee per matched payment in original currency.
  - name: int__settlements__settlement_lag
    description: Grain payout_id. Elapsed days from payment to payout.
  - name: int__settlements__unmatched_payouts
    description: Grain payout_id. Payouts without a matching captured attempt.
