models:
  - name: int__margin__fees_with_rates
    description: One row per int__settlements__fees_by_payment fee, beside the payout day's USD rate.
  - name: int__margin__fees_value_usd
    description: One row per int__settlements__fees_by_payment fee, in USD at the payout-day rate.
  - name: int__margin__refunds_with_rates
    description: Grain refund_id. Refund amount in original currency beside the refund day's USD rate.
  - name: int__margin__refund_value_usd
    description: Grain refund_id. Refund amount in USD at refund-day rate.
  - name: int__margin__activity
    description: >
      One row per settled order, refund or fee, keyed by (report_date, merchant_id);
      each row carries its own USD measure and zero for the other two.
  - name: int__margin__activity_by_day
    description: Grain (report_date, merchant_id). USD revenue, refunds and fees.
  - name: int__margin__merchant_day_margin
    description: Grain (report_date, merchant_id). Contribution after refunds and fees.
  - name: int__margin__negative_margin_days
    description: Grain (report_date, merchant_id). Merchant-days with negative contribution.
