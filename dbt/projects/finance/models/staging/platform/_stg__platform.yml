# Imports from the platform project (resolved by dbt-loom). Everything else in
# this project refs these wrappers, never ref('platform', ...) directly:
# - one place to pin or migrate an upstream model version;
# - unit tests mock local nodes. dbt-core 1.12 builds unit-test fixture nodes
#   without the producer's `access`, so a fixture for ref('platform', ...) is
#   treated as protected to platform and rejected under dbt-loom.
models:
  - name: stg__platform__orders
    description: >-
      One row per order_id, imported from platform's public fct__orders contract through a
      cross-project ref. Projects customer, merchant, business order date, status and gross
      major-unit amount in the recorded currency. Completed, cancelled and pending orders
      remain present; consumers apply their own status filters. This explicit local projection
      gives finance a stable input node for downstream SQL and unit-test fixtures; it performs
      no additional filtering or aggregation.
    access: private
  - name: stg__platform__fx_rates_by_day
    description: >-
      One row per effective rate_date and currency_code, importing deprecated version 1 of
      platform's public FX contract. Explicitly selects rate_to_usd and source_rate_date so
      finance's conversion SQL remains pinned to the USD column name during the v2 migration.
      The producer controls carry-forward and missing-rate behavior; this import neither fills
      null rates nor recalculates cross-rates.
    access: private
  - name: stg__platform__payments_by_day__usd_total
    description: >-
      One row per payment_date, merchant_id and currency_code, imported from platform's public
      fct__payments_by_day__usd_total contract through a cross-project ref. Projects
      business-day capture, refund and net totals in original major units and USD. USD values
      remain null where the producer has no usable event-date FX rate. This explicit local
      projection gives finance a stable input node for downstream SQL and unit-test fixtures;
      it performs no additional filtering or aggregation.
    access: private

  - name: stg__platform__merchants
    description: >-
      One row per merchant_id, imported from platform's public dim__merchants contract through
      a cross-project ref. Projects current merchant country, settlement currency, display
      name and IANA time zone. Attributes have no historical effective dates; they describe
      the current merchant export. This explicit local projection gives finance a stable input
      node for downstream SQL and unit-test fixtures; it performs no additional filtering or
      aggregation.
  - name: stg__platform__customers
    description: >-
      One row per customer_id, imported from platform's public dim__customers contract through
      a cross-project ref. Projects account country and business signup date. The import omits
      the enriched purchase counts and home currency available in the producer contract. This
      explicit local projection gives finance a stable input node for downstream SQL and
      unit-test fixtures; it performs no additional filtering or aggregation.
  - name: stg__platform__refunds
    description: >-
      One row per refund_id, imported from platform's public fct__refunds contract through a
      cross-project ref. Projects successful refund amount in original-currency major units
      with UTC refund time and payment/order/merchant links. Partial refunds remain individual
      events; the producer has already filtered unsuccessful and unmatched refunds. This
      explicit local projection gives finance a stable input node for downstream SQL and
      unit-test fixtures; it performs no additional filtering or aggregation.
  - name: stg__platform__payment_attempts
    description: >-
      One row per payment_id, imported from platform's public fct__payment_attempts contract
      through a cross-project ref. Projects attempt status, original-currency major-unit
      amount and UTC creation time with order/merchant links. Successful captures and failed
      retries remain distinct attempt records. This explicit local projection gives finance a
      stable input node for downstream SQL and unit-test fixtures; it performs no additional
      filtering or aggregation.
  - name: stg__platform__payouts
    description: >-
      One row per payout_id, imported from platform's public fct__payouts contract through a
      cross-project ref. Projects merchant/payment linkage, UTC paid_at, original currency and
      net amount in minor units. The import omits the producer fee_amount because finance
      derives fees from gross payment less provider net. This explicit local projection gives
      finance a stable input node for downstream SQL and unit-test fixtures; it performs no
      additional filtering or aggregation.
