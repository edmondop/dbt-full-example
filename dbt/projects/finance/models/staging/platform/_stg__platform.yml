# Imports from the platform project (resolved by dbt-loom). Everything else in
# this project refs these wrappers, never ref('platform', ...) directly:
# - one place to pin or migrate an upstream model version;
# - unit tests mock local nodes. dbt-core 1.12 builds unit-test fixture nodes
#   without the producer's `access`, so a fixture for ref('platform', ...) is
#   treated as protected to platform and rejected under dbt-loom.
models:
  - name: stg__platform__orders
    description: One order-grain import of platform's public order contract.
    access: private
  - name: stg__platform__fx_rates_by_day
    description: Pinned to deprecated v1 of fct__fx_rates_by_day (column rate_to_usd).
    access: private
  - name: stg__platform__payments_by_day__usd_total
    description: Platform payment totals by business date, merchant and currency.
    access: private

  - name: stg__platform__merchants
    description: One public merchant dimension row per merchant.
  - name: stg__platform__customers
    description: One public customer dimension row per customer.
  - name: stg__platform__refunds
    description: One public refund fact row per refund.
  - name: stg__platform__payment_attempts
    description: One public payment fact row per provider attempt.
  - name: stg__platform__payouts
    description: One row per provider payout.
