models:
  - name: fct__fx_rates_by_day
    description: >-
      One row per calendar day and quoted currency. Rate into var('reporting_currency') with ECB quotes carried
      forward up to var('fx_max_carry_forward_days') days.
    access: public
    latest_version: 2
    config:
      contract: {enforced: true}
    columns:
      - name: rate_date
        data_type: date
        constraints: [type: not_null]
        description: '{{ doc("rate_date") }}'
      - name: currency_code
        data_type: varchar
        constraints: [type: not_null]
        description: '{{ doc("currency_code__fx") }}'
      - name: reporting_currency_code
        data_type: varchar
        description: '{{ doc("reporting_currency_code") }}'
      - name: rate_to_reporting
        data_type: "decimal(18, 8)"
        description: '{{ doc("rate_to_reporting") }}'
      - name: source_rate_date
        data_type: date
        description: '{{ doc("source_rate_date") }}'
      - name: is_carried_forward
        data_type: boolean
        description: '{{ doc("is_carried_forward") }}'
    versions:
      - v: 2
      - v: 1
        # Breaking change in v2: rate_to_usd renamed to rate_to_reporting, and
        # reporting_currency_code / is_carried_forward added. Consumers pinned
        # to v=1 get a deprecation warning until they migrate.
        deprecation_date: 2026-12-31
        columns:
          - include: all
            exclude: [rate_to_reporting, reporting_currency_code, is_carried_forward]
          - name: rate_to_usd
            data_type: "decimal(18, 8)"
            description: '{{ doc("rate_to_usd") }}'

  - name: dim__currencies
    description: One row per reference currency with its minor-unit exponent.
    columns:
      - name: currency_code
        description: '{{ doc("currency_code__reference") }}'
      - name: minor_units
        description: '{{ doc("minor_units") }}'
  - name: fct__fx_coverage
    description: One row per calendar day. Counts reference currencies with and without a usable rate, and ECB
      publications.
    columns:
      - name: date_day
        description: '{{ doc("date_day") }}'
      - name: currency_count
        description: '{{ doc("currency_count") }}'
      - name: covered_currency_count
        description: '{{ doc("covered_currency_count") }}'
      - name: published_currency_count
        description: '{{ doc("published_currency_count") }}'
      - name: missing_currency_count
        description: '{{ doc("missing_currency_count") }}'
  - name: fct__latest_fx_rates
    description: One row per currency with a usable rate. Inner-joins the rate on its latest rate_date.
    columns:
      - name: currency_code
        description: '{{ doc("currency_code__fx") }}'
      - name: rate_date
        description: '{{ doc("rate_date") }}'
      - name: rate_to_reporting
        description: '{{ doc("rate_to_reporting") }}'
