models:
  - name: fct__shipments
    description: One row per shipment with a known order. Left-joins the label's tracking code.
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: shipment_id
        data_type: bigint
        data_tests:
          - unique
          - not_null
        description: '{{ doc("shipment_id") }}'
      - name: order_id
        data_type: bigint
        description: '{{ doc("order_id") }}'
      - name: customer_id
        data_type: bigint
        description: '{{ doc("customer_id") }}'
      - name: merchant_id
        data_type: bigint
        description: '{{ doc("merchant_id") }}'
      - name: shipped_at
        data_type: timestamp
        description: '{{ doc("shipped_at") }}'
      - name: delivered_at
        data_type: timestamp
        description: '{{ doc("delivered_at") }}'
      - name: delivery_days
        data_type: integer
        description: '{{ doc("delivery_days") }}'
      - name: tracking_code
        data_type: varchar
        description: '{{ doc("tracking_code") }}'
  - name: fct__delivery_attempts
    description: One row per delivery attempt whose shipment and carrier exist. Inner-joins order_id and 
      carrier_name.
    columns:
      - name: shipment_id
        description: '{{ doc("shipment_id") }}'
      - name: order_id
        description: '{{ doc("order_id") }}'
      - name: attempt_at
        description: '{{ doc("attempt_at") }}'
      - name: outcome
        description: '{{ doc("outcome") }}'
      - name: carrier_name
        description: '{{ doc("carrier_name") }}'
  - name: fct__delayed_shipments
    description: One row per shipment with delivery_days greater than 3.
    columns:
      - name: shipment_id
        description: '{{ doc("shipment_id") }}'
      - name: order_id
        description: '{{ doc("order_id") }}'
      - name: merchant_id
        description: '{{ doc("merchant_id") }}'
      - name: delivery_days
        description: '{{ doc("delivery_days") }}'
      - name: failed_attempts
        description: '{{ doc("failed_attempts") }}'
  - name: dim__warehouses
    description: One row per warehouse with its country.
    columns:
      - name: warehouse_id
        description: '{{ doc("warehouse_id") }}'
      - name: country_code
        description: '{{ doc("country_code") }}'
  - name: fct__inventory_snapshot
    description: One row per SKU and warehouse with a known product. Inner-joins the category.
    columns:
      - name: sku
        description: '{{ doc("sku") }}'
      - name: warehouse_id
        description: '{{ doc("warehouse_id") }}'
      - name: category_id
        description: '{{ doc("category_id") }}'
      - name: on_hand
        description: '{{ doc("on_hand") }}'
