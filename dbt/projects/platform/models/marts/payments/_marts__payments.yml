models:
  - name: fct__payments_by_day__usd_total
    description: >-
      One row per payment_date, merchant and currency. Converts daily settled amounts to USD at that day's rate;
      USD columns are null when the day has no usable rate.
    access: public
    config:
      contract: {enforced: true}
    data_tests:
      - unique:
          arguments:
            column_name: "cast(payment_date as varchar) || '-' || cast(merchant_id as varchar) || '-' || currency_code"
    columns:
      - name: payment_date
        data_type: date
        constraints: [type: not_null]
        description: '{{ doc("payment_date") }}'
      - name: merchant_id
        data_type: bigint
        constraints: [type: not_null]
        description: '{{ doc("merchant_id") }}'
      - name: currency_code
        data_type: varchar
        constraints: [type: not_null]
        description: '{{ doc("currency_code") }}'
      - name: gross_amount
        data_type: "decimal(18, 4)"
        description: '{{ doc("gross_amount") }}'
      - name: refunded_amount
        data_type: "decimal(18, 4)"
        description: '{{ doc("refunded_amount") }}'
      - name: net_amount
        data_type: "decimal(18, 4)"
        description: '{{ doc("net_amount") }}'
      - name: fx_rate_to_usd
        data_type: "decimal(18, 8)"
        description: '{{ doc("fx_rate_to_usd") }}'
      - name: gross_amount_usd
        data_type: "decimal(18, 4)"
        description: '{{ doc("gross_amount_usd") }}'
      - name: refunded_amount_usd
        data_type: "decimal(18, 4)"
        description: '{{ doc("refunded_amount_usd") }}'
      - name: net_amount_usd
        data_type: "decimal(18, 4)"
        data_tests:
          - not_null:
              config:
                severity: warn   # a null means no usable FX rate for that day

        description: '{{ doc("net_amount_usd") }}'
  - name: fct__payment_attempts
    description: One row per payment attempt with a known order, in any status.
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: payment_id
        data_type: varchar
        data_tests:
          - unique
          - not_null
        description: '{{ doc("payment_id") }}'
      - name: order_id
        data_type: bigint
        description: '{{ doc("order_id") }}'
      - name: merchant_id
        data_type: bigint
        description: '{{ doc("merchant_id") }}'
      - name: currency_code
        data_type: varchar
        description: '{{ doc("currency_code") }}'
      - name: amount
        data_type: decimal(18, 4)
        description: '{{ doc("amount") }}'
      - name: payment_status
        data_type: varchar
        description: '{{ doc("payment_status") }}'
      - name: created_at
        data_type: timestamp
        description: '{{ doc("created_at") }}'
  - name: fct__refunds
    description: One row per succeeded refund whose payment and order exist.
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: refund_id
        data_type: varchar
        data_tests:
          - unique
          - not_null
        description: '{{ doc("refund_id") }}'
      - name: payment_id
        data_type: varchar
        description: '{{ doc("payment_id") }}'
      - name: order_id
        data_type: bigint
        description: '{{ doc("order_id") }}'
      - name: merchant_id
        data_type: bigint
        description: '{{ doc("merchant_id") }}'
      - name: currency_code
        data_type: varchar
        description: '{{ doc("currency_code") }}'
      - name: amount
        data_type: decimal(18, 4)
        description: '{{ doc("amount") }}'
      - name: refunded_at
        data_type: timestamp
        description: '{{ doc("refunded_at") }}'
  - name: fct__disputes
    description: One row per dispute whose payment exists. Inner-joins the payment's order_id.
    columns:
      - name: dispute_id
        description: '{{ doc("dispute_id") }}'
      - name: payment_id
        description: '{{ doc("payment_id") }}'
      - name: order_id
        description: '{{ doc("order_id") }}'
      - name: dispute_status
        description: '{{ doc("dispute_status") }}'
      - name: amount_minor
        description: '{{ doc("amount_minor") }}'
  - name: fct__payouts
    description: One row per payout with a balance transaction and a PSP fee. Inner-joins net_minor and the 
      fee in major units.
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: payout_id
        data_type: varchar
        data_tests:
          - unique
          - not_null
        description: '{{ doc("payout_id") }}'
      - name: merchant_id
        data_type: bigint
        description: '{{ doc("merchant_id") }}'
      - name: payment_id
        data_type: varchar
        description: '{{ doc("payment_id") }}'
      - name: paid_at
        data_type: timestamp
        description: '{{ doc("paid_at") }}'
      - name: net_minor
        data_type: bigint
        description: '{{ doc("net_minor") }}'
      - name: currency_code
        data_type: varchar
        description: '{{ doc("currency_code") }}'
      - name: fee_amount
        data_type: decimal(18, 4)
        description: '{{ doc("fee_amount") }}'

  - name: fct__failed_payment_attempts
    description: One row per failed payment attempt with a known order. Inner-joins the order's merchant.
    columns:
      - name: payment_id
        description: '{{ doc("payment_id") }}'
      - name: order_id
        description: '{{ doc("order_id") }}'
      - name: merchant_id
        description: '{{ doc("merchant_id") }}'
      - name: currency_code
        description: '{{ doc("currency_code") }}'
      - name: amount
        description: '{{ doc("amount") }}'
      - name: created_at
        description: '{{ doc("created_at") }}'
