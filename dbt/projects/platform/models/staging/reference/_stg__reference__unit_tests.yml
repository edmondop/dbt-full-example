unit_tests:
  - name: stg__reference__fx_rates__parses_rates_and_nulls_missing
    description: >
      Rate strings become decimals; `N/A` cells (no rate published) become
      null instead of failing the cast.
    model: stg__reference__fx_rates
    given:
      - input: source('reference', 'fx_rates')
        rows:
          - {date: "2025-01-02", usd: "1.0350", jpy: " 163.20", gbp: "N/A"}
    expect:
      rows:
        - {rate_date: 2025-01-02, usd_per_eur: 1.035, jpy_per_eur: 163.2, gbp_per_eur: null}
