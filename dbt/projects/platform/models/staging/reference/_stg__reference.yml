sources:
  - name: reference
    description: >
      Reference feed with ECB euro foreign exchange rates, as published: one row per
      TARGET business day, one string column per currency (units per 1 EUR),
      `N/A` where no rate was published.
    database: raw
    schema: reference
    tables:
      - name: fx_rates
        description: ECB daily reference-rate extract with string-valued currency columns.
      - name: currencies
        description: Supported currency codes and minor-unit exponents.
      - name: countries
        description: Marketplace country and home currency mapping.
      - name: calendar
        description: Reporting dates covering the generated order period.
      - name: holidays
        description: Named reference holidays in the reporting period.

models:
  - name: stg__reference__fx_rates
    description: >-
      One row per ECB publication date. One `<currency>_per_eur` column per currency in var('fx_currencies'); `N/A`
      becomes null.
    columns:
      - name: usd_per_eur
        description: '{{ doc("currency_units_per_eur") }}'
      - name: jpy_per_eur
        description: '{{ doc("currency_units_per_eur") }}'
      - name: gbp_per_eur
        description: '{{ doc("currency_units_per_eur") }}'
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
        data_tests: [unique, not_null]
  - name: stg__reference__currencies
    description: One row per currency with its ISO 4217 minor-unit exponent.

    columns:
      - name: currency_code
        description: '{{ doc("currency_code__reference") }}'
      - name: minor_units
        description: '{{ doc("minor_units") }}'
  - name: stg__reference__countries
    description: One row per country. Maps each country to its currency.

    columns:
      - name: country_code
        description: '{{ doc("country_code") }}'
      - name: currency_code
        description: '{{ doc("currency_code__country") }}'
  - name: stg__reference__calendar
    description: One row per calendar day in the reference calendar.

    columns:
      - name: date_day
        description: '{{ doc("date_day") }}'
  - name: stg__reference__holidays
    description: One row per reference holiday.
    columns:
      - name: date_day
        description: '{{ doc("date_day") }}'
      - name: holiday_label
        description: '{{ doc("holiday_label") }}'
