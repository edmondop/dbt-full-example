models:
  - name: int__reference__fx_quoted_units_per_eur
    description: >-
      One row per ECB publication date and currency in var('fx_currencies'). Unpivots the export's per-currency
      columns.
    columns:
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
      - name: currency_code
        description: '{{ doc("currency_code__fx") }}'
      - name: units_per_eur
        description: '{{ doc("units_per_eur") }}'
  - name: int__reference__fx_published_units_per_eur
    description: One row per ECB publication date and quoted currency with a non-null quote.
    columns:
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
      - name: currency_code
        description: '{{ doc("currency_code__fx") }}'
      - name: units_per_eur
        description: '{{ doc("units_per_eur") }}'
        data_tests: [not_null]
  - name: int__reference__fx_publication_dates
    description: One row per ECB publication date with at least one quote.
    columns:
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
  - name: int__reference__fx_eur_units_per_eur
    description: One row per ECB publication date. Adds EUR at 1 unit per EUR.
    columns:
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
      - name: currency_code
        description: '{{ doc("currency_code__fx") }}'
      - name: units_per_eur
        description: '{{ doc("units_per_eur") }}'
  - name: int__reference__fx_units_per_eur
    description: One row per ECB publication date and currency, EUR included. Unions published quotes and the 
      EUR rows.
    columns:
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
      - name: currency_code
        description: '{{ doc("currency_code__fx") }}'
      - name: units_per_eur
        description: '{{ doc("units_per_eur") }}'
  - name: int__reference__fx_reporting_units_per_eur
    description: One row per ECB publication date. Selects the quote of var('reporting_currency').
    columns:
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
      - name: reporting_units_per_eur
        description: '{{ doc("reporting_units_per_eur") }}'
  - name: int__reference__fx_units_with_reporting_units
    description: One row per ECB publication date and currency. Inner-joins the reporting currency's quote for
      the same date.
    columns:
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
      - name: currency_code
        description: '{{ doc("currency_code__fx") }}'
      - name: units_per_eur
        description: '{{ doc("units_per_eur") }}'
      - name: reporting_units_per_eur
        description: '{{ doc("reporting_units_per_eur") }}'
  - name: int__reference__fx_cross_rates
    description: >-
      One row per ECB publication date and currency. Divides reporting_units_per_eur by units_per_eur.
    columns:
      - name: rate_date
        description: '{{ doc("rate_date__publication") }}'
      - name: currency_code
        description: '{{ doc("currency_code__fx") }}'
      - name: rate_to_reporting
        description: '{{ doc("rate_to_reporting__published") }}'
  - name: int__reference__calendar_days
    description: One row per day from var('start_date') through var('end_date'), generated by date_spine_days.
    columns:
      - name: date_day
        description: '{{ doc("date_day") }}'
  - name: int__reference__calendar_days_with_holidays
    description: One row per calendar day. Left-joins the reference holiday date.
    columns:
      - name: date_day
        description: '{{ doc("date_day") }}'
      - name: holiday_date
        description: '{{ doc("holiday_date") }}'
