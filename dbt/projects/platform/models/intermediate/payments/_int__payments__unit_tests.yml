unit_tests:
  - name: int__payments__payment_settlement_events__keeps_succeeded_payments_only
    model: int__payments__payment_settlement_events
    given:
      - input: ref('int__payments__attempts_with_merchant')
        rows:
          - {payment_id: py_1, merchant_id: 7, currency_code: EUR, amount: 100, payment_status: succeeded, created_at: "2025-03-01 09:00:00", loaded_at: "2025-03-01 09:05:00"}
          - {payment_id: py_2, merchant_id: 7, currency_code: EUR, amount: 100, payment_status: failed, created_at: "2025-03-01 08:00:00", loaded_at: "2025-03-01 08:05:00"}
    expect:
      rows:
        - {event_at: "2025-03-01 09:00:00", merchant_id: 7, currency_code: EUR, gross_amount: 100, refunded_amount: 0, net_amount: 100}

  - name: int__payments__refund_settlement_events__nets_refund_out
    model: int__payments__refund_settlement_events
    given:
      - input: ref('int__payments__refunds_with_orders')
        rows:
          - {refund_id: re_1, merchant_id: 7, currency_code: EUR, amount: 40, refunded_at: "2025-03-01 18:00:00", loaded_at: "2025-03-01 18:30:00"}
    expect:
      rows:
        - {event_at: "2025-03-01 18:00:00", merchant_id: 7, currency_code: EUR, gross_amount: 0, refunded_amount: 40, net_amount: -40}

  - name: int__payments__net_by_day__nets_refunds_against_payments
    model: int__payments__net_by_day
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int__payments__settlement_events_by_day')
        rows:
          - {payment_date: 2025-03-01, merchant_id: 7, currency_code: EUR, gross_amount: 100, refunded_amount: 0, net_amount: 100, loaded_at: "2025-03-01 09:05:00"}
          - {payment_date: 2025-03-01, merchant_id: 7, currency_code: EUR, gross_amount: 0, refunded_amount: 40, net_amount: -40, loaded_at: "2025-03-01 18:30:00"}
    expect:
      rows:
        - {payment_date: 2025-03-01, merchant_id: 7, currency_code: EUR, gross_amount: 100, refunded_amount: 40, net_amount: 60}

  - name: int__payments__net_by_day__incremental_reprocesses_late_days_only
    description: >
      The table already holds loads up to 2025-03-10. A refund for 2025-03-05
      arrives late (loaded 2025-03-09, inside the 3-day lookback), so all of
      2025-03-05 is recomputed, including its payment loaded long ago. 2025-03-01
      has no recent loads and is not touched.
    model: int__payments__net_by_day
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows:
          - {payment_date: 2025-03-05, merchant_id: 7, currency_code: EUR, gross_amount: 100, refunded_amount: 0, net_amount: 100, max_loaded_at: "2025-03-05 10:00:00"}
          - {payment_date: 2025-03-10, merchant_id: 7, currency_code: EUR, gross_amount: 50, refunded_amount: 0, net_amount: 50, max_loaded_at: "2025-03-10 12:00:00"}
      - input: ref('int__payments__settlement_events_by_day')
        rows:
          - {payment_date: 2025-03-01, merchant_id: 7, currency_code: EUR, gross_amount: 30, refunded_amount: 0, net_amount: 30, loaded_at: "2025-03-01 09:05:00"}
          - {payment_date: 2025-03-05, merchant_id: 7, currency_code: EUR, gross_amount: 100, refunded_amount: 0, net_amount: 100, loaded_at: "2025-03-05 10:00:00"}
          - {payment_date: 2025-03-05, merchant_id: 7, currency_code: EUR, gross_amount: 0, refunded_amount: 25, net_amount: -25, loaded_at: "2025-03-09 06:00:00"}
    expect:
      rows:
        - {payment_date: 2025-03-05, merchant_id: 7, currency_code: EUR, gross_amount: 100, refunded_amount: 25, net_amount: 75}

  - name: int__payments__net_by_day__incremental_on_empty_table_processes_everything
    description: >
      Regression: an incremental run against an existing empty table must not
      filter on `loaded_at > null`, which selects nothing.
    model: int__payments__net_by_day
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        rows: []
      - input: ref('int__payments__settlement_events_by_day')
        rows:
          - {payment_date: 2024-01-01, merchant_id: 7, currency_code: EUR, gross_amount: 10, refunded_amount: 0, net_amount: 10, loaded_at: "2024-01-01 09:05:00"}
    expect:
      rows:
        - {payment_date: 2024-01-01, merchant_id: 7, currency_code: EUR, net_amount: 10}

  - name: int__payments__net_by_day_with_rates__keeps_days_without_rate
    model: int__payments__net_by_day_with_rates
    given:
      - input: ref('int__payments__net_by_day')
        rows:
          - {payment_date: 2025-03-01, merchant_id: 1, currency_code: GBP, gross_amount: 10, refunded_amount: 0, net_amount: 10}
      - input: ref('int__fx_rates__rates_by_day')
        rows: []
    expect:
      rows:
        - {payment_date: 2025-03-01, merchant_id: 1, currency_code: GBP, net_amount: 10, rate_to_reporting: null}
