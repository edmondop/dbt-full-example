models:
  - name: int__fx_rates__currencies
    description: Grain currency_code. Currencies with at least one published cross rate, including EUR.
  - name: int__fx_rates__currency_days
    description: >
      Grain (date_day, currency_code). Every calendar day for every currency;
      published_rate_date is null on days without an ECB publication.
  - name: int__fx_rates__source_rate_dates
    description: Grain (date_day, currency_code). Most recent publication date on or before date_day.
  - name: int__fx_rates__carry_forward_days
    description: Grain (date_day, currency_code). Days between date_day and its source publication; 0 on publication days.
  - name: int__fx_rates__carried_cross_rates
    description: Grain (date_day, currency_code). The source publication's cross rate, before the carry-forward limit.
  - name: int__fx_rates__rates_by_day
    description: >
      Rate into var('reporting_currency') for every (calendar day, currency),
      carrying the last ECB publication forward over non-publication days.
    columns:
      - name: rate_to_reporting
        description: Units of reporting currency per 1 unit of currency_code; null when the last publication is too old.
      - name: source_rate_date
        description: ECB publication date the rate comes from.
      - name: days_carried_forward
        description: 0 on publication days.
