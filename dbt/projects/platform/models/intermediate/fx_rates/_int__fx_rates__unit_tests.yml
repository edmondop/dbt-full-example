# int__fx_rates__rates_by_day is ephemeral in normal runs. Unit tests run with
# --vars '{unit_testing: true}' (mise run unit), which makes it a view:
# - dbt-trino creates the unit test relation in the model's schema, and an
#   ephemeral model never creates that schema (DuckDB happens not to care);
# - models that ref() it can mock it with dict fixtures, which dbt rejects
#   for ephemeral inputs (they would need format: sql).
unit_tests:
  - name: int__fx_rates__source_rate_dates__carries_friday_publication_over_weekend
    model: int__fx_rates__source_rate_dates
    given:
      - input: ref('int__fx_rates__currency_days')
        rows:
          # Friday and Monday published; Saturday and Sunday not.
          - {date_day: 2025-01-03, currency_code: GBP, published_rate_date: 2025-01-03}
          - {date_day: 2025-01-04, currency_code: GBP, published_rate_date: null}
          - {date_day: 2025-01-05, currency_code: GBP, published_rate_date: null}
          - {date_day: 2025-01-06, currency_code: GBP, published_rate_date: 2025-01-06}
          - {date_day: 2025-01-04, currency_code: USD, published_rate_date: null}
    expect:
      rows:
        - {date_day: 2025-01-03, currency_code: GBP, source_rate_date: 2025-01-03}
        - {date_day: 2025-01-04, currency_code: GBP, source_rate_date: 2025-01-03}
        - {date_day: 2025-01-05, currency_code: GBP, source_rate_date: 2025-01-03}
        - {date_day: 2025-01-06, currency_code: GBP, source_rate_date: 2025-01-06}
        - {date_day: 2025-01-04, currency_code: USD, source_rate_date: null}

  - name: int__fx_rates__rates_by_day__nulls_rate_beyond_carry_forward_limit
    description: A gap longer than var('fx_max_carry_forward_days') must not reuse a stale rate.
    model: int__fx_rates__rates_by_day
    overrides:
      vars: {fx_max_carry_forward_days: 1}
    given:
      - input: ref('int__fx_rates__carried_cross_rates')
        rows:
          - {date_day: 2025-01-01, currency_code: USD, source_rate_date: 2025-01-01, days_carried_forward: 0, source_rate_to_reporting: 1}
          - {date_day: 2025-01-02, currency_code: USD, source_rate_date: 2025-01-01, days_carried_forward: 1, source_rate_to_reporting: 1}
          - {date_day: 2025-01-03, currency_code: USD, source_rate_date: 2025-01-01, days_carried_forward: 2, source_rate_to_reporting: 1}
    expect:
      rows:
        - {rate_date: 2025-01-01, currency_code: USD, rate_to_reporting: 1, days_carried_forward: 0}
        - {rate_date: 2025-01-02, currency_code: USD, rate_to_reporting: 1, days_carried_forward: 1}
        - {rate_date: 2025-01-03, currency_code: USD, rate_to_reporting: null, days_carried_forward: 2}
