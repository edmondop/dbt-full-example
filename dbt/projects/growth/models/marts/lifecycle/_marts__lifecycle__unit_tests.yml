unit_tests:
  - name: fct__email_reengagement__counts_zero_for_sends_without_response
    model: fct__email_reengagement
    given:
      - input: ref('int__lifecycle__email_send_orders')
        rows:
          - {email_send_id: 1, customer_id: 7, order_id: 10}
          - {email_send_id: 2, customer_id: 8, order_id: null}
    expect:
      rows:
        - {email_send_id: 1, customer_id: 7, completed_orders_within_window: 1}
        - {email_send_id: 2, customer_id: 8, completed_orders_within_window: 0}
