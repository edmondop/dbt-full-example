unit_tests:
  - name: fct__cohort_retention_by_month__divides_active_customers_by_cohort_size
    model: fct__cohort_retention_by_month
    given:
      - input: ref('int__cohorts__retention_with_cohort_size')
        rows:
          - {cohort_month: 2025-01-01, months_since_first_order: 0, cohort_size: 2, active_customers: 2}
          - {cohort_month: 2025-01-01, months_since_first_order: 1, cohort_size: 2, active_customers: 1}
    expect:
      rows:
        - {cohort_month: 2025-01-01, months_since_first_order: 0, cohort_size: 2, active_customers: 2, retention_rate: 1}
        - {cohort_month: 2025-01-01, months_since_first_order: 1, cohort_size: 2, active_customers: 1, retention_rate: 0.5}
