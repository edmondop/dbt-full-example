models:
  - name: int__acquisition__touchpoints
    description: Grain customer_id. Customer first-touch campaign and channel.
  - name: int__acquisition__attribution_windows
    description: >
      Grain customer_id. First touch with the last order date it can claim,
      var('attribution_lookback_days') after the attribution date.
  - name: int__acquisition__attributed_orders
    description: Grain order_id. Completed orders within the configured first-touch attribution window.
  - name: int__acquisition__channel_performance
    description: Grain channel. Attributed customers and orders per acquisition channel.
  - name: int__acquisition__impressions_by_campaign
    description: Grain campaign_id. Campaign reach from impressions.
  - name: int__acquisition__clicks_with_campaign
    description: Grain click_id. Each click with the campaign of its impression.
  - name: int__acquisition__clicks_by_campaign
    description: Grain campaign_id. Campaign clicks linked to impressions.
  - name: int__acquisition__campaign_reach_counts
    description: Grain campaign_id. Every campaign with its impression and click counts; null where it has none.
