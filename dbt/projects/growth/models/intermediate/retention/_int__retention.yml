models:
  - name: int__retention__monthly_activity
    description: Grain (customer_id, activity_month). Completed orders by customer and calendar month.
  - name: int__retention__last_order
    description: Grain customer_id. Last completed order date per customer.
  - name: int__retention__orders_after_first
    description: Grain completed order. Completed orders dated after the customer's first-purchase day.
  - name: int__retention__second_order
    description: Grain customer_id. First completed order date after the customer first-purchase day.
  - name: int__retention__dormant_customers
    description: Grain customer_id. Customers without a completed order during the dormancy window.
  - name: int__retention__active_customer_months
    description: Grain activity_month. Distinct active customers per calendar month.
  - name: int__retention__calendar_months
    description: Grain activity_month. Every month in the platform calendar.
  - name: int__retention__monthly_active_counts
    description: Grain activity_month. Every calendar month with its active customer count; null when none.
