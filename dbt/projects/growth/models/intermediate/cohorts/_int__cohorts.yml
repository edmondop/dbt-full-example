models:
  - name: int__cohorts__first_order_dates
    description: Grain customer_id. Date of the customer's first completed order.
  - name: int__cohorts__first_order_by_customer
    description: Grain customer_id. A customer's acquisition cohort is the month of their first completed order.
    access: private
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: int__cohorts__cohort_sizes
    description: Grain cohort_month. New customers in each first-purchase month.
  - name: int__cohorts__order_months
    description: Grain completed order. Order activity month, currency and amount beside the customer's cohort month.
  - name: int__cohorts__customer_active_months
    description: Grain customer_id. Number of distinct calendar months with a completed order.
  - name: int__cohorts__repeat_customers
    description: Grain customer_id. Cohort customers who bought in more than one month.
  - name: int__cohorts__revenue_by_month
    description: Grain (cohort_month, activity_month, currency_code). Cohort revenue in original currency.
  - name: int__cohorts__cohort_spend
    description: Grain (customer_id, currency_code). Customer gross spend beside the customer's cohort month.
  - name: int__cohorts__cohort_activity
    description: Grain (customer_id, activity_month). Months with a completed order beside the customer's cohort month.
  - name: int__cohorts__cohort_activity_offsets
    description: >
      Grain (customer_id, activity_month). Calendar months between the cohort
      month and the activity month; 0 for the first-order month.
  - name: int__cohorts__active_customers_by_offset
    description: Grain (cohort_month, months_since_first_order). Distinct active cohort customers.
  - name: int__cohorts__retention_with_cohort_size
    description: Grain (cohort_month, months_since_first_order). Active customers beside the cohort size.
