models:
  - name: int__cohorts__first_order_dates
    description: One row per customer with a completed order. Takes the minimum order_date.
    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
      - name: first_order_date
        description: '{{ doc("first_order_date") }}'
  - name: int__cohorts__first_order_by_customer
    description: One row per customer with a completed order. Derives cohort_month from first_order_date.
    access: private
    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
        data_tests: [unique, not_null]
      - name: first_order_date
        description: '{{ doc("first_order_date") }}'
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
  - name: int__cohorts__cohort_sizes
    description: One row per cohort_month. Counts customers.
    columns:
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: cohort_size
        description: '{{ doc("cohort_size") }}'
  - name: int__cohorts__order_months
    description: One row per completed order. Inner-joins the customer's cohort_month.
    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: activity_month
        description: '{{ doc("activity_month") }}'
      - name: currency_code
        description: '{{ doc("currency_code") }}'
      - name: order_amount
        description: '{{ doc("order_amount") }}'
  - name: int__cohorts__customer_active_months
    description: One row per customer. Counts distinct months with a completed order.
    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: active_months
        description: '{{ doc("active_months") }}'
  - name: int__cohorts__repeat_customers
    description: One row per customer with completed orders in more than one month.
    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: active_months
        description: '{{ doc("active_months") }}'
  - name: int__cohorts__revenue_by_month
    description: One row per cohort_month, activity_month and currency. Sums completed order amounts.
    columns:
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: activity_month
        description: '{{ doc("activity_month") }}'
      - name: currency_code
        description: '{{ doc("currency_code") }}'
      - name: gross_amount
        description: '{{ doc("gross_amount__orders") }}'
  - name: int__cohorts__cohort_spend
    description: One row per customer and currency. Inner-joins the customer's cohort_month.
    columns:
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: currency_code
        description: '{{ doc("currency_code") }}'
      - name: gross_spend
        description: '{{ doc("gross_spend") }}'
  - name: int__cohorts__cohort_activity
    description: One row per customer and active month. Inner-joins the customer's cohort_month.
    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: activity_month
        description: '{{ doc("activity_month") }}'
  - name: int__cohorts__cohort_activity_offsets
    description: >-
      One row per customer and active month. Computes months since cohort_month.
    columns:
      - name: customer_id
        description: '{{ doc("customer_id") }}'
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: months_since_first_order
        description: '{{ doc("months_since_first_order") }}'
  - name: int__cohorts__active_customers_by_offset
    description: One row per cohort_month and months_since_first_order. Counts distinct active customers.
    columns:
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: months_since_first_order
        description: '{{ doc("months_since_first_order") }}'
      - name: active_customers
        description: '{{ doc("active_customers") }}'
  - name: int__cohorts__retention_with_cohort_size
    description: One row per cohort_month and months_since_first_order. Inner-joins cohort_size.
    columns:
      - name: cohort_month
        description: '{{ doc("cohort_month") }}'
      - name: months_since_first_order
        description: '{{ doc("months_since_first_order") }}'
      - name: cohort_size
        description: '{{ doc("cohort_size") }}'
      - name: active_customers
        description: '{{ doc("active_customers") }}'
