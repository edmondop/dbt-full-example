# Landing zone: external Hive tables over Parquet files the loader uploads to s3://raw/.
# The file metastore keeps table definitions in the same bucket, so no Hive metastore service is needed.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://raw/_metastore
hive.non-managed-table-writes-enabled=false
fs.s3.enabled=true
s3.endpoint=http://garage:3900
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
hive.timestamp-precision=MICROSECONDS
