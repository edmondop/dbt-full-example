models:
  - name: fct__revenue_by_day__usd_total
    description: Completed-order revenue per (order_date, merchant) in USD.
    access: protected
    config:
      contract: {enforced: true}
    columns:
      - {name: order_date, data_type: date, constraints: [{type: not_null}]}
      - {name: merchant_id, data_type: bigint, constraints: [{type: not_null}]}
      - {name: completed_orders, data_type: bigint}
      - {name: revenue_usd, data_type: "decimal(18, 4)"}
