models:
  - name: int__orders__with_amounts
    description: >
      Orders with their total in the order currency (major units) and the
      order date in var('business_timezone').
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int__orders__order_lines_with_products
    description: One row per order line with catalog category and order currency.
  - name: int__orders__discounts_by_order
    description: One row per discounted order.
  - name: int__orders__completed
    description: One row per completed order with its gross amount.
  - name: int__orders__with_discounts
    description: One row per completed order after promotional discounts.
