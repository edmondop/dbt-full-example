unit_tests:
  - name: int__orders__with_amounts__order_date_follows_business_timezone
    description: >
      23:30 UTC on 31 Jan is already 1 Feb in Tokyo, so the order belongs to
      February when the business day is defined in Asia/Tokyo.
    model: int__orders__with_amounts
    overrides:
      vars: {business_timezone: Asia/Tokyo}
    given:
      - input: ref('stg__shop__orders')
        rows:
          - {order_id: 1, currency_code: JPY, ordered_at: "2025-01-31 23:30:00"}
      - input: ref('stg__shop__order_items')
        rows:
          - {order_id: 1, line_amount_minor: 1200}
          - {order_id: 1, line_amount_minor: 300}
    expect:
      rows:
        - {order_id: 1, order_date: 2025-02-01, order_amount_minor: 1500, order_amount: 1500}

  - name: int__orders__with_amounts__order_without_items_totals_zero
    model: int__orders__with_amounts
    given:
      - input: ref('stg__shop__orders')
        rows:
          - {order_id: 2, currency_code: EUR, ordered_at: "2025-01-01 10:00:00"}
      - input: ref('stg__shop__order_items')
        rows: []
    expect:
      rows:
        - {order_id: 2, order_amount_minor: 0, order_amount: 0}

  - name: int__orders__with_discounts__uses_applied_promotion
    model: int__orders__with_discounts
    given:
      - input: ref('int__orders__completed')
        rows:
          - {order_id: 1, customer_id: 2, merchant_id: 3, currency_code: USD, order_amount: 100}
      - input: ref('int__orders__discounts_by_order')
        rows:
          - {order_id: 1, promotion_id: 3, discount_amount_minor: 250}
      - input: ref('stg__shop__promotions')
        rows:
          - {promotion_id: 3, merchant_id: 3, discount_percent: 10}
    expect:
      rows:
        - {order_id: 1, discount_amount_minor: 250, applied_discount_percent: 10, net_order_amount: 97.5}
