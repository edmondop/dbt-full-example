models:
  - name: fct__fx_rates_by_day
    description: >
      Daily FX rate into the reporting currency for every calendar day and
      currency, with ECB rates carried forward over non-publication days.
    access: public
    latest_version: 2
    config:
      contract: {enforced: true}
    columns:
      - {name: rate_date, data_type: date, constraints: [{type: not_null}]}
      - {name: currency_code, data_type: varchar, constraints: [{type: not_null}]}
      - {name: reporting_currency_code, data_type: varchar}
      - name: rate_to_reporting
        data_type: "decimal(18, 8)"
        description: Units of reporting currency per 1 unit of currency_code; null when the last publication is older than var('fx_max_carry_forward_days').
      - {name: source_rate_date, data_type: date}
      - {name: is_carried_forward, data_type: boolean}
    versions:
      - v: 2
      - v: 1
        # Breaking change in v2: rate_to_usd renamed to rate_to_reporting, and
        # reporting_currency_code / is_carried_forward added. Consumers pinned
        # to v=1 get a deprecation warning until they migrate.
        deprecation_date: 2026-12-31
        columns:
          - include: all
            exclude: [rate_to_reporting, reporting_currency_code, is_carried_forward]
          - {name: rate_to_usd, data_type: "decimal(18, 8)"}
