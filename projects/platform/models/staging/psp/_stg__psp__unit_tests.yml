unit_tests:
  - name: stg__psp__payments__converts_minor_units_per_currency
    description: >
      JPY has no minor unit, so 1500 minor units are 1500 JPY, while 1500 EUR
      cents are 15.00 EUR. Lowercase PSP currency codes are normalised.
    model: stg__psp__payments
    given:
      - input: source('psp', 'payments')
        rows:
          - {id: py_1, metadata_order_id: "10", amount: 1500, currency: jpy, status: succeeded, created: 0}
          - {id: py_2, metadata_order_id: "11", amount: 1500, currency: eur, status: succeeded, created: 0}
    expect:
      rows:
        - {payment_id: py_1, order_id: 10, currency_code: JPY, amount: 1500}
        - {payment_id: py_2, order_id: 11, currency_code: EUR, amount: 15}

  - name: stg__psp__payments__epoch_seconds_are_utc
    description: The session time zone must not shift PSP epoch timestamps.
    model: stg__psp__payments
    given:
      - input: source('psp', 'payments')
        rows:
          - {id: py_1, metadata_order_id: "1", amount: 100, currency: usd, status: succeeded, created: 1735689599}
    expect:
      rows:
        - {payment_id: py_1, created_at: "2024-12-31 23:59:59"}
