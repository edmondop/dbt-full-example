sources:
  - name: psp
    description: >
      Payment service provider export (Stripe-like). Amounts are integer minor
      units, currencies are lowercase, `created` is epoch seconds, and
      `_loaded_at` is when the row reached the export, which can lag `created`
      by days.
    database: raw
    schema: psp
    loaded_at_field: _loaded_at
    freshness:
      warn_after: {count: 1, period: day}
    tables:
      - name: payments
      - name: refunds

models:
  - name: stg__psp__payments
    description: One row per payment attempt, including failed attempts.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests: [not_null]
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: [succeeded, failed]

  - name: stg__psp__refunds
    description: One row per refund. Partial refunds carry less than the payment amount.
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: payment_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg__psp__payments')
                field: payment_id
