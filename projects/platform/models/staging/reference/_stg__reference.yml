sources:
  - name: reference
    description: >
      Reference feed with ECB euro foreign exchange rates, as published: one row per
      TARGET business day, one string column per currency (units per 1 EUR),
      `N/A` where no rate was published.
    database: raw
    schema: reference
    tables:
      - name: fx_rates
      - name: currencies
      - name: countries
      - name: calendar
      - name: holidays

models:
  - name: stg__reference__fx_rates
    description: >
      One row per published (rate_date, currency_code). Unpivots the currency
      columns listed in `var('fx_currencies')` and drops `N/A` cells, so weekends
      and holidays are absent rather than null.
    data_tests:
      - unique:
          arguments:
            column_name: "cast(rate_date as varchar) || '-' || currency_code"
    columns:
      - name: units_per_eur
        data_tests: [not_null]

  - name: stg__reference__currencies
    description: One row per supported currency and minor-unit exponent.

  - name: stg__reference__countries
    description: One row per market country and home currency.

  - name: stg__reference__calendar
    description: One row per date in the example reporting window.

  - name: stg__reference__holidays
    description: One row per reference holiday.
