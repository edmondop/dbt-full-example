unit_tests:
  - name: stg__ecb__fx_rates__unpivots_and_drops_missing
    description: >
      A wide ECB row becomes one row per currency; `N/A` cells (no rate
      published) are dropped instead of becoming null rates.
    model: stg__ecb__fx_rates
    given:
      - input: source('ecb', 'eurofxref')
        rows:
          - {date: "2025-01-02", usd: "1.0350", jpy: "163.20", gbp: "N/A"}
    expect:
      rows:
        - {rate_date: 2025-01-02, currency_code: USD, units_per_eur: 1.035}
        - {rate_date: 2025-01-02, currency_code: JPY, units_per_eur: 163.2}
