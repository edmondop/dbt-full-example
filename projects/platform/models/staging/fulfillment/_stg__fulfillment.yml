sources:
  - name: fulfillment
    database: raw
    schema: fulfillment
    tables:
      - name: warehouses
      - name: carriers
      - name: shipments
      - name: shipping_labels
      - name: shipment_events
      - name: delivery_attempts
    description: Warehouse and carrier shipment event feed.
models:
  - name: stg__fulfillment__warehouses
    description: One row per warehouse location.
  - name: stg__fulfillment__carriers
    description: One row per delivery carrier.
  - name: stg__fulfillment__shipments
    description: One row per shipped order.
  - name: stg__fulfillment__shipping_labels
    description: One tracking label per shipment.
  - name: stg__fulfillment__shipment_events
    description: One timestamped status event per shipment.
  - name: stg__fulfillment__delivery_attempts
    description: One delivery attempt per shipment.
