name: growth
version: "0.1.0"
config-version: 2
profile: marketplace
require-dbt-version: [">=1.12.0", "<1.13.0"]

model-paths: ["models"]
macro-paths: ["macros"]

dispatch:
  - macro_namespace: marketplace_macros
    search_order: ["growth", "marketplace_macros"]

vars:
  unit_testing: false
  dev_schema_prefix: "{{ env_var('USER', 'dev') }}"

models:
  growth:
    +group: growth
    staging:
      +schema: growth_staging
      +materialized: view
    intermediate:
      +schema: growth_intermediate
    marts:
      +schema: growth
      +materialized: table
