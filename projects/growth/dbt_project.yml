name: growth
version: "0.1.0"
config-version: 2
profile: marketplace
require-dbt-version: [">=1.12.0", "<1.13.0"]

model-paths: ["models"]
macro-paths: ["macros"]

dispatch:
  - macro_namespace: marketplace_macros
    search_order: ["growth", "marketplace_macros"]
  - macro_namespace: dbt
    search_order: ["dbt_project_evaluator", "dbt"]

vars:
  exclude_packages: [platform]
  end_date: "2025-12-31"
  attribution_lookback_days: 30
  email_response_days: 30
  dormancy_days: 90
  unit_testing: false
  dev_schema_prefix: "{{ env_var('USER', 'dev') }}"

models:
  dbt_project_evaluator:
    +schema: growth_governance
    marts:
      core:
        # Cut the evaluator's recursive DAG query before Trino's stage limit.
        int_all_dag_relationships:
          +materialized: table
  growth:
    +group: growth
    staging:
      +schema: growth_staging
      +materialized: view
    intermediate:
      +schema: growth_intermediate
    marts:
      +schema: growth
      +materialized: table

data_tests:
  dbt_project_evaluator:
    marts:
      governance:
        +severity: error
